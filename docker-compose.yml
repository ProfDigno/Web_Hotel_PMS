services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bdhotel_pms_1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
    ports:
      - "5434:5432"
    volumes:
      - hotel_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bdhotel_pms_1"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  hotel_pg_data:
